<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistema Almoxarifado</title>
<style>body{font-family:Arial;margin:0;background:#f3f6f9;color:#17202a}header{background:#14532d;color:#fff;padding:20px}main{max-width:1100px;margin:20px auto;padding:0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card,section{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 8px #0001}.card{cursor:pointer;border:0;text-align:left;font-size:16px}.card b{display:block;font-size:28px;margin-top:10px;color:#14532d}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}input,select,button{padding:11px;border:1px solid #ccd5dd;border-radius:8px;font-size:15px}button{background:#166534;color:white;border:0;cursor:pointer}.full{grid-column:1/-1}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}.muted{color:#667085}</style></head>
<body><header><h1>Sistema de Almoxarifado</h1><div>Controle de entrada, saída, estoque e logística</div></header><main>
<div class="grid"><button class="card" onclick="show('entrada')">Entrada<b>＋</b><span class="muted">Registrar recebimentos</span></button><button class="card" onclick="show('saida')">Saída<b>−</b><span class="muted">Registrar retiradas</span></button><button class="card" onclick="show('estoque')">Estoque<b id="total">0</b><span class="muted">Consultar saldo</span></button><button class="card" onclick="show('logistica')">Logística<b>↔</b><span class="muted">Movimentações e endereços</span></button></div>
<section id="app" style="margin-top:18px"><h2>Bem-vindo</h2><p class="muted">Escolha uma opção acima para começar.</p></section></main>
<script>const key='almox_movimentos';let dados=JSON.parse(localStorage.getItem(key)||'[]');function save(){localStorage.setItem(key,JSON.stringify(dados));document.getElementById('total').textContent=dados.reduce((s,x)=>s+(x.tipo==='Entrada'?Number(x.qtd):x.tipo==='Saída'?-Number(x.qtd):0),0)}function show(p){let title=p==='entrada'?'Registrar entrada':p==='saida'?'Registrar saída':p==='estoque'?'Consulta de estoque':'Logística e endereçamento';if(p==='estoque'){render(title,`<input id="busca" placeholder="Pesquisar código ou descrição" oninput="list()"><div id="lista"></div>`);list();return}if(p==='logistica'){render(title,`<p class="muted">Use este módulo para acompanhar rua, endereço, lote e movimentação.</p><div id="lista"></div>`);list();return}render(title,`<form onsubmit="add(event)"><input id="codigo" placeholder="Código" required><input id="desc" placeholder="Descrição do SKU" required><input id="qtd" type="number" min="1" placeholder="Quantidade" required><input id="und" placeholder="Unidade (UN, CX...)" value="UN"><input id="end" placeholder="Endereço"><input id="lote" placeholder="Lote fornecedor"><input id="nf" placeholder="Nota fiscal"><input id="obs" placeholder="Observação"><button class="full">Salvar ${p==='entrada'?'entrada':'saída'}</button></form>`);window.tipo=p==='entrada'?'Entrada':'Saída'}function render(t,h){document.getElementById('app').innerHTML='<h2>'+t+'</h2>'+h}function add(e){e.preventDefault();dados.push({tipo:window.tipo,codigo:codigo.value,desc:desc.value,qtd:qtd.value,und:und.value,end:end.value,lote:lote.value,nf:nf.value,obs:obs.value,data:new Date().toLocaleString('pt-BR')});save();alert('Movimentação registrada.');show(window.tipo==='Entrada'?'entrada':'saida')}function list(){let q=(document.getElementById('busca')?.value||'').toLowerCase();let arr=dados.filter(x=>(x.codigo+' '+x.desc).toLowerCase().includes(q));document.getElementById('lista').innerHTML='<table><tr><th>Data</th><th>Tipo</th><th>Código</th><th>Descrição</th><th>Qtd.</th><th>Endereço</th></tr>'+arr.map(x=>`<tr><td>${x.data}</td><td>${x.tipo}</td><td>${x.codigo}</td><td>${x.desc}</td><td>${x.qtd} ${x.und}</td><td>${x.end||'-'}</td></tr>`).join('')+'</table>'}save();</script></body></html>
